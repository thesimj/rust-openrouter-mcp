name: CI

# Fast quality gate on every push and PR: format, lint, and the full test suite.
# The release workflow (release-mcpb.yml) only runs on a version tag, so without
# this nothing exercises the tests before a release ships. Kept to a single Linux
# runner for speed — the cross-platform build is proven at release time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref, so a busy
# PR doesn't queue stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning, matching the clippy gate below.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
