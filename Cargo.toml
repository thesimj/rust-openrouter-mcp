[package]
name = "openrouter-mcp"
version = "0.6.0"
edition = "2024"
# Verified, not guessed: `cargo +1.88 check --all-targets` passes. Several
# dependencies (rmcp, pinned to 3.1.2 in the lock; image 0.25.10; darling 0.24.0;
# the icu_* 2.3.0 family) declare rust-version 1.88 too, and our own use of
# let-chains stabilized in 1.88. CI builds at this version so the claim stays true.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "MCP stdio server and CLI for OpenRouter: model discovery, image generation/editing, and image description"
authors = ["Nick Bubelich <n+github@bubelich.com>"]
repository = "https://github.com/thesimj/rust-openrouter-mcp"
homepage = "https://github.com/thesimj/rust-openrouter-mcp"
readme = "README.md"
keywords = ["mcp", "openrouter", "cli", "image-generation", "vision"]
categories = ["api-bindings", "command-line-utilities", "multimedia::images"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "src/**",
]

[[bin]]
name = "openrouter-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (pure Rust) instead of the default native-tls/OpenSSL backend: no C
# toolchain or system OpenSSL to link, so the static musl build (shipped as the
# Linux .mcpb) is a plain cross-compile. In reqwest 0.13, `rustls` uses the
# platform verifier and system trust configuration, matching the old native-tls
# behavior - so a user behind a corporate TLS-inspecting proxy whose custom root
# CA lives in the OS store still connects. `charset` + `http2` are default
# reqwest features re-added after `default-features = false`.
# `gzip` makes reqwest send `Accept-Encoding: gzip` and decompress transparently.
# OpenRouter honors it and serves nothing else (br/zstd/deflate all come back
# uncompressed), and the payloads are highly compressible JSON: `/models` measured
# 672,715 -> 71,498 bytes on the wire, an 89% saving on the tool we call most.
# Costs one new crate, `async-compression`; flate2/miniz_oxide are already in the
# tree via `png`, so the size delta is just the async wrapper.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "charset", "http2", "rustls", "gzip"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Rasterizes SVG inputs to PNG before sending (re-exports usvg + tiny-skia).
# Pure Rust, no system libraries. As of 0.48 its own MSRV is 1.85, below ours;
# rmcp, image, darling, and the icu_* family are what actually set the 1.88 floor.
resvg = { version = "0.48", default-features = false }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Test-only HTTP mock server for exercising the OpenRouter client and MCP tool
# without hitting the live API. Not shipped to users (dev-dependencies are
# excluded from `cargo install` and the published crate).
wiremock = "0.6"

[profile.release]
opt-level = "z"      # optimize for size
debug = false        # no DWARF debug info (this is the cargo default; explicit here)
strip = "symbols"    # also drop the symbol table -> smaller binary, no debug/symbol info
lto = "thin"         # cross-crate inlining + dead-code elimination across all crates
codegen-units = 1    # whole-program optimization (slower compile, smaller output)
panic = "abort"      # drop unwinding tables/landing pads (release aborts on panic)
